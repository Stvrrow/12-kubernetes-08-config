apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-page
  namespace: homework-23
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ru">
    <head><meta charset="UTF-8"><title>Netology: HTTPS</title></head>
    <body>
      <h1>Netology: HTTPS работает</h1>
      <p>Выполнил: Стрельников Александр. Задание 2.3.</p>
      <p>ConfigMap secure-page + TLS Secret + Ingress.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-web
  namespace: homework-23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-web
  template:
    metadata:
      labels:
        app: secure-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: page
          configMap:
            name: secure-page
---
apiVersion: v1
kind: Service
metadata:
  name: secure-web
  namespace: homework-23
spec:
  selector:
    app: secure-web
  ports:
    - port: 80
      targetPort: http
