apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: homework-23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: nginx-http
              containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: nginx-http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: multitool
          image: wbitt/network-multitool:alpine-minimal
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: multitool-config
                  key: HTTP_PORT
            - name: HTTPS_PORT
              valueFrom:
                configMapKeyRef:
                  name: multitool-config
                  key: HTTPS_PORT
          ports:
            - name: multitool-http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: multitool-http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: page
          configMap:
            name: web-page
