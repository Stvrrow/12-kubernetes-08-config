apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: homework-23
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik
  namespace: homework-23
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: homework-23
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: homework-23
roleRef:
  kind: Role
  name: traefik
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homework-23-traefik
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homework-23-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: homework-23
roleRef:
  kind: ClusterRole
  name: homework-23-traefik
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: homework-23-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: homework-23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.6.0
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=homework-23
            - --providers.kubernetesingress.ingressclass=homework-23-traefik
            - --entrypoints.websecure.address=:8443
            - --entrypoints.health.address=:9000
            - --ping=true
            - --ping.entrypoint=health
            - --accesslog=true
          ports:
            - name: websecure
              containerPort: 8443
            - name: health
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: homework-23
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: https
      port: 443
      targetPort: websecure
      nodePort: 30443
